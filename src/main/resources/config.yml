# ======================================================
#            TimedItem Configuration (v1.1.0)
# ======================================================

# Active language of the plugin:
#   "en" : English (loads lang/lang_en.yml)
#   "vi" : Vietnamese (loads lang/lang_vi.yml)
# If set to "vi", reloading the plugin (/ti reload) will
# automatically switch this configuration file to Vietnamese!
language: "en"

# Date format for commands and expiration display
# Default: dd/MM/yyyy HH:mm:ss
date-format: "dd/MM/yyyy HH:mm:ss"

# Maximum duration allowed for an item (e.g. 365d, 3650d)
# Prevents arithmetic overflow when adding time to items
max-duration: "3650d"

# Periodic check interval for online player inventories & worlds (in seconds)
# Recommended: 30 to 60 seconds
check-interval: 30

# Fast equipment check interval (in seconds)
# Checks armor & held items every X seconds to immediately remove expired gear
equipment-check-interval: 2

# Game modes where inactive timed items are automatically activated
# Countdown begins only when held or stored in these game modes
activation-gamemodes:
  - SURVIVAL
  - ADVENTURE

# Whether to check items dropped in the world
world-check: true

# Whether to check online player inventories
inventory-check: true

# Whether to check inside containers (Shulker Boxes, Bundles) for expired items
container-check: true

# Offline player scanning:
# Scans offline playerdata files (.dat) asynchronously.
# NOTE: It is recommended to leave this FALSE unless strictly necessary,
# because TimedItem already checks and removes expired items automatically
# when a player joins the server.
offline-check: false

# How often to run the offline playerdata scan (in seconds)
# Default: 1800 (every 30 minutes). Only active if offline-check is true.
offline-check-interval: 1800

# Number of items shown per help page (/ti help)
help-per-page: 7

# Technical settings for Extension Tokens (Phiếu Gia Hạn)
# Display name & lore of tokens are localized in lang/lang_en.yml or lang/lang_vi.yml
token:
  material: PAPER
  custom-model-data: 0
  glow: true
