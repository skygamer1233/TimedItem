# ======================================================
#       Cấu Hình TimedItem - Tiếng Việt (config_vi.yml)
# ======================================================

# Thiết lập ngôn ngữ hoạt động của plugin:
#   "vi" : Sử dụng Tiếng Việt (nạp file lang_vi.yml)
#   "en" : Sử dụng Tiếng Anh (nạp file lang_en.yml)
# (Lưu ý: Dòng hiển thị Lore trên item và tên/lore Phiếu Gia Hạn
#  được cấu hình trực tiếp trong file lang_vi.yml hoặc lang_en.yml)
language: "vi"

# Định dạng ngày giờ cho lệnh /ti set và hiển thị thời điểm hết hạn
# Mặc định: dd/MM/yyyy HH:mm:ss
date-format: "dd/MM/yyyy HH:mm:ss"

# Thời gian tối đa cho phép của một item (vd: 365d, 3650d)
# Ngăn chặn lỗi tràn số khi cộng dồn thời hạn quá lớn
max-duration: "3650d"

# Chu kỳ kiểm tra vật phẩm hết hạn định kỳ (tính bằng giây)
# Khuyến nghị: 30 đến 60 giây để tối ưu máy chủ
check-interval: 30

# Chu kỳ quét nhanh các ô trang bị (tính bằng giây)
# Quét giáp và item trên tay mỗi X giây để lập tức thu hồi đồ hết hạn
equipment-check-interval: 2

# Chế độ chơi (GameMode) sẽ tự động kích hoạt tính giờ cho item
# Thời gian chỉ bắt đầu đếm ngược khi người chơi ở các chế độ này
activation-gamemodes:
  - SURVIVAL
  - ADVENTURE

# Có kiểm tra và tự động dọn dẹp các vật phẩm hết hạn bị rơi trên mặt đất không
world-check: true

# Có kiểm tra túi đồ của người chơi đang online không
inventory-check: true

# Có kiểm tra bên trong vật phẩm chứa đồ (Hộp Shulker, Bundle) không
container-check: true

# Quét người chơi ngoại tuyến (Offline):
# Quét các file playerdata (.dat) bất đồng bộ.
# LƯU Ý: Khuyến nghị để FALSE trừ khi thực sự cần thiết,
# vì TimedItem đã tự động kiểm tra và xóa item hết hạn khi người chơi đăng nhập.
offline-check: false

# Chu kỳ quét file playerdata offline (tính bằng giây)
# Mặc định: 1800 (mỗi 30 phút). Chỉ hoạt động khi offline-check là true.
offline-check-interval: 1800

# Số lượng lệnh hiển thị trên mỗi trang của bảng trợ giúp (/ti help)
help-per-page: 7

# Thiết lập kỹ thuật cho vật phẩm Phiếu Gia Hạn (Extension Tokens):
# (Phần chữ hiển thị tên và lore của phiếu nằm trong lang_vi.yml / lang_en.yml)
token:
  # Loại vật phẩm đại diện cho phiếu (VD: PAPER, FEATHER, NETHER_STAR...)
  material: PAPER

  # Mã CustomModelData (dùng nếu server có cài Resource Pack, đặt 0 nếu không dùng)
  custom-model-data: 0

  # Hiệu ứng phát sáng phù phép (true: có phát sáng, false: không)
  glow: true
