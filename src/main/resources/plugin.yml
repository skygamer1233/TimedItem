name: TimedItem
version: 1.1.0
main: me.timeditem.TimedItem
api-version: '1.21'
description: Advanced item expiration and duration management for Minecraft
author: SkyGamer
softdepend: [MMOItems, PlaceholderAPI]
commands:
  ti:
    description: TimedItem main command
    usage: /ti <add|remove|set|clear|check|give|givemmo|token|reload|help>
    aliases: [timeditem]
permissions:
  timeditem.*:
    description: Gives full access to all TimedItem commands and permissions
    default: op
    children:
      timeditem.admin: true
  timeditem.admin:
    description: Gives access to all administrative commands
    default: op
    children:
      timeditem.command.add: true
      timeditem.command.remove: true
      timeditem.command.set: true
      timeditem.command.clear: true
      timeditem.command.check: true
      timeditem.command.give: true
      timeditem.command.givemmo: true
      timeditem.command.token: true
      timeditem.command.reload: true
      timeditem.command.help: true
  timeditem.command.add:
    description: Add duration to timed item
    default: op
  timeditem.command.remove:
    description: Remove duration from timed item
    default: op
  timeditem.command.set:
    description: Set exact expiration date or duration
    default: op
  timeditem.command.clear:
    description: Clear expiration time from item
    default: op
  timeditem.command.check:
    description: Check timed item in hand
    default: true
  timeditem.command.give:
    description: Give timed vanilla item to a player
    default: op
  timeditem.command.givemmo:
    description: Give timed MMOItems item to a player
    default: op
  timeditem.command.token:
    description: Create or give Time Extension Tokens
    default: op
  timeditem.command.reload:
    description: Reload TimedItem configuration and languages
    default: op
  timeditem.command.help:
    description: View command help
    default: true
