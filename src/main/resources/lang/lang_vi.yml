  add: "&6/ti add <time> [DELETE|SEAL] &7- Thêm thời hạn cho vật phẩm trên tay."
  remove: "&6/ti remove <time> &7- Xoá bớt thời hạn của vật phẩm trên tay."
  set: "&6/ti set <format> [DELETE|SEAL] &7- Đặt thời hạn hoặc ngày hết hạn."
  clear: "&6/ti clear &7- Xoá hoàn toàn thời hạn khỏi vật phẩm."
  mode: "&6/ti mode <DELETE|SEAL> &7- Chỉnh chế độ khi hết hạn (Xóa hoặc Phong ấn)."
  check: "&6/ti check &7- Kiểm tra chi tiết thời hạn vật phẩm trên tay."
  save: "&6/ti save <id> &7- Lưu vật phẩm trên tay vào kho mẫu."
  delete: "&6/ti delete <id> &7- Xoá mẫu vật phẩm đã lưu."
  list: "&6/ti list &7- Xem danh sách các mẫu vật phẩm đã lưu."
